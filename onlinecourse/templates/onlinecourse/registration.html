<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Online Learning Platform</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #f0f2f5;
        }
        .auth-card {
            max-width: 480px;
            margin: 50px auto;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="{% url 'onlinecourse:index' %}">Online Learning Platform</a>
        </div>
    </nav>

    <div class="container">
        <div class="card auth-card">
            <div class="card-body p-4">
                <h3 class="card-title text-center font-weight-bold mb-4 text-primary">Create Your Account</h3>

                {% if message %}
                <div class="alert alert-danger" role="alert">
                    {{ message }}
                </div>
                {% endif %}

                <form action="{% url 'onlinecourse:registration' %}" method="post">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="firstname" class="font-weight-bold">First Name</label>
                            <input type="text" class="form-control" id="firstname" name="firstname" placeholder="First name">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="lastname" class="font-weight-bold">Last Name</label>
                            <input type="text" class="form-control" id="lastname" name="lastname" placeholder="Last name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="username" class="font-weight-bold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="font-weight-bold">Password</label>
                        <input type="password" class="form-control" id="password" name="psw" placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block font-weight-bold py-2 mt-4">
                        Register
                    </button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted">Already have an account?</span>
                    <a href="{% url 'onlinecourse:login' %}" class="font-weight-bold ml-1">Sign In</a>
                </div>
                <div class="text-center mt-2">
                    <a href="{% url 'onlinecourse:index' %}" class="text-secondary small">&larr; Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
